name: Verificar pacote Konaet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  composite-smoke-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Executar composite sem alteracoes e com token somente leitura
        uses: ./propose
        id: smoke
        with:
          token: ${{ github.token }}
          bot-login: fixture[bot]
          bot-id: '1234'
          paths: state
          branch: konaet/smoke-${{ github.run_id }}-${{ github.run_attempt }}
          base: ${{ github.event.repository.default_branch }}
      - name: Conferir ausencia de escrita
        env:
          CHANGED: ${{ steps.smoke.outputs.changed }}
          PROPOSAL_URL: ${{ steps.smoke.outputs.pr-url }}
        run: |
          set -euo pipefail
          [ "$CHANGED" = false ]
          [ -z "$PROPOSAL_URL" ]
          [ -z "$(git status --porcelain)" ]
          echo 'Composite de leitura aprovado; nenhuma escrita ou App autenticada. Cenarios adversos usam Git local real na suite MATLAB.' >> "$GITHUB_STEP_SUMMARY"

  configuracao:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validar workflows e configuracao da App
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
          jq -e '.name == "Konaet" and .public == true and
            .hook_attributes.active == false and .default_events == [] and
            .default_permissions == {"contents":"write","pull_requests":"write"}' github-app.json

  contratos-git-e-visuais:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: 7dsol3/konaet-sovereign-spec/infra/setup-ubuntu@441b0f1b92d606cfa4e56ef66f51d451428d7c9d
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2026b
      - name: Testar contratos e Git local real
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('tests'); run_konaet_tests(pwd,fullfile(pwd,'artifacts')); run_activation_tests(pwd,fullfile(pwd,'artifacts'));
      - name: Guardar o relatorio de testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: konaet-test-report
          path: |
            artifacts/test-report.json
            artifacts/activation-test-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Desenhar a vitrine em MATLAB
        if: github.event_name == 'workflow_dispatch'
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: r = jsondecode(fileread(fullfile('artifacts','test-report.json'))); addpath('visuals'); output = fullfile(pwd,'artifacts','showcase'); render_konaet_assets(output,r); copyfile(fullfile('artifacts','test-report.json'),fullfile(output,'test-report.json')); verify_konaet_assets(output);
      - name: Verificar as midias publicadas
        if: github.event_name != 'workflow_dispatch'
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('visuals'); verify_konaet_assets(fullfile(pwd,'assets'));
      - name: Mostrar o alcance da verificacao
        run: |
          jq -r '"Konaet: \(.passed)/\(.total) cenarios offline aprovados.\n\nApp real: \(.live_app.status).\n\nA suite usa Git local real e API gh de teste. Veja os relatorios e os visuais nos artifacts."' artifacts/test-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar evidencias e vitrine
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: konaet-evidence-and-showcase
          path: |
            artifacts/
            assets/
          if-no-files-found: warn
          retention-days: 14
