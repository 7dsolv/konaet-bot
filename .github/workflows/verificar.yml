name: Verificar pacote Konaet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composite-smoke-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preparar remoto Git local e API de teste
        run: |
          set -euo pipefail
          bare="$RUNNER_TEMP/konaet-smoke.git"
          git clone --bare . "$bare"
          git --git-dir="$bare" update-ref refs/heads/main HEAD
          raw="$(git config --get remote.origin.url)"
          git config "url.${bare}.insteadOf" "$raw"
          mock="$RUNNER_TEMP/konaet-mock"
          mkdir -p "$mock" state
          cat > "$mock/gh" <<'MOCK'
          #!/usr/bin/env bash
          set -euo pipefail
          case "$1 $2" in
            'pr list') exit 0 ;;
            'pr create') printf 'https://github.com/%s/pull/23\n' "$GITHUB_REPOSITORY" ;;
            *) exit 90 ;;
          esac
          MOCK
          chmod 700 "$mock/gh"
          echo "$mock" >> "$GITHUB_PATH"
          printf 'Composite offline smoke\n' > state/konaet-smoke.txt
          git rev-parse HEAD > "$RUNNER_TEMP/konaet-smoke-base"
      - name: Executar o composite com Git real e API de teste
        uses: ./propose
        id: smoke
        with:
          token: offline-fixture-not-a-token
          bot-login: fixture[bot]
          bot-id: '1234'
          paths: state/konaet-smoke.txt
          branch: konaet/smoke
          base: main
      - name: Conferir o efeito no remoto local
        env:
          CHANGED: ${{ steps.smoke.outputs.changed }}
          PROPOSAL_URL: ${{ steps.smoke.outputs.pr-url }}
        run: |
          set -euo pipefail
          [ "$CHANGED" = true ]
          [ "$PROPOSAL_URL" = "https://github.com/$GITHUB_REPOSITORY/pull/23" ]
          bare="$RUNNER_TEMP/konaet-smoke.git"
          [ "$(git --git-dir="$bare" rev-parse refs/heads/main)" = "$(cat "$RUNNER_TEMP/konaet-smoke-base")" ]
          git --git-dir="$bare" show refs/heads/konaet/smoke:state/konaet-smoke.txt
          echo 'Composite offline aprovado: Git local real, API substituida e nenhuma App autenticada.' >> "$GITHUB_STEP_SUMMARY"

  configuracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar workflows e configuracao da App
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
          jq -e '.name == "Konaet" and .public == true and
            .hook_attributes.active == false and .default_events == [] and
            .default_permissions == {"contents":"write","pull_requests":"write"}' github-app.json

  contratos-git-e-visuais:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
      - name: Testar contratos e Git local real
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests'); run_konaet_tests(pwd,fullfile(pwd,'artifacts')); run_activation_tests(pwd,fullfile(pwd,'artifacts'));
      - name: Guardar o relatorio de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: konaet-test-report
          path: |
            artifacts/test-report.json
            artifacts/activation-test-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Desenhar a vitrine em MATLAB
        if: github.event_name == 'workflow_dispatch'
        uses: matlab-actions/run-command@v3
        with:
          command: r = jsondecode(fileread(fullfile('artifacts','test-report.json'))); addpath('visuals'); output = fullfile(pwd,'artifacts','showcase'); render_konaet_assets(output,r); copyfile(fullfile('artifacts','test-report.json'),fullfile(output,'test-report.json')); verify_konaet_assets(output);
      - name: Verificar as midias publicadas
        if: github.event_name != 'workflow_dispatch'
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('visuals'); verify_konaet_assets(fullfile(pwd,'assets'));
      - name: Mostrar o alcance da verificacao
        run: |
          jq -r '"Konaet: \(.passed)/\(.total) cenarios offline aprovados.\n\nApp real: \(.live_app.status).\n\nA suite usa Git local real e API gh de teste. Veja os relatorios e os visuais nos artifacts."' artifacts/test-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar evidencias e vitrine
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: konaet-evidence-and-showcase
          path: |
            artifacts/
            assets/
          if-no-files-found: warn
          retention-days: 14
