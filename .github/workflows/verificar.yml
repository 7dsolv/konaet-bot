name: Verificar pacote Konaet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar workflows e configuracao da App
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
          jq -e '.name == "Konaet" and .public == true and
            .hook_attributes.active == false and .default_events == [] and
            .default_permissions == {"contents":"write","pull_requests":"write"}' github-app.json

  cadastro-matlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
      - uses: matlab-actions/run-command@v3
        with:
          command: u = abrir_cadastro_konaet(false); p = matlab.net.URI(u); assert(strcmp(p.Host,'github.com')); assert(strcmp(p.Path(end),'new')); assert(contains(u,'name=Konaet')); assert(contains(u,'public=true')); assert(contains(u,'webhook_active=false')); assert(contains(u,'contents=write')); assert(contains(u,'pull_requests=write'));
