name: Konaet - commit e proposta para revisao

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konaet-demo-proposal
  cancel-in-progress: false

jobs:
  propor:
    runs-on: ubuntu-24.04
    steps:
      - name: Autenticar a App Konaet
        id: konaet
        uses: 7dsolv/konaet-bot@v1.1.1
        with:
          client-id: ${{ vars.KONAET_APP_CLIENT_ID }}
          private-key: ${{ secrets.KONAET_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.konaet.outputs.token }}
          fetch-depth: 0

      - name: Preparar a branch e gerar um arquivo demonstrativo
        env:
          PROPOSAL_BRANCH: konaet/demo-status
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$PROPOSAL_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$PROPOSAL_BRANCH"
            git switch -c "$PROPOSAL_BRANCH" FETCH_HEAD
          else
            git switch -c "$PROPOSAL_BRANCH"
          fi
          mkdir -p state
          date -u '+Konaet: ultima execucao em %Y-%m-%dT%H:%M:%SZ' > state/konaet-status.txt

      - name: Enviar somente o arquivo permitido para revisao
        uses: ./propose
        with:
          token: ${{ steps.konaet.outputs.token }}
          bot-login: ${{ steps.konaet.outputs.bot-login }}
          bot-id: ${{ steps.konaet.outputs.bot-id }}
          paths: state/konaet-status.txt
          branch: konaet/demo-status
          base: ${{ github.event.repository.default_branch }}
          title: 'Konaet: atualizar estado demonstrativo'
          body: Demonstracao de identidade, diff permitido e proposta. O mantenedor decide o merge.
