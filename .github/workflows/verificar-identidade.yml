name: Verificar identidade real da App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identidade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Iniciar evidencia sem credenciais
        run: |
          mkdir -p artifacts
          jq -n --arg revision "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version:1,status:"NOT_VERIFIED",source_revision:$revision,run_url:$run,fixture_used:false}' > artifacts/live-app.json

      - name: Conferir configuracao antes de autenticar
        env:
          APP_CLIENT_ID: ${{ vars.KONAET_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.KONAET_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::error::Cadastre e instale a App; configure KONAET_APP_CLIENT_ID e KONAET_APP_PRIVATE_KEY.'
            exit 1
          fi

      - name: Resolver a identidade real
        uses: ./
        id: konaet
        with:
          client-id: ${{ vars.KONAET_APP_CLIENT_ID }}
          private-key: ${{ secrets.KONAET_APP_PRIVATE_KEY }}

      - name: Registrar o resultado sem publicar conteudo
        env:
          BOT_LOGIN: ${{ steps.konaet.outputs.bot-login }}
          BOT_ID: ${{ steps.konaet.outputs.bot-id }}
          INSTALLATION_ID: ${{ steps.konaet.outputs.installation-id }}
          GH_TOKEN: ${{ steps.konaet.outputs.token }}
        run: |
          set -euo pipefail
          gh api /installation/repositories > "$RUNNER_TEMP/konaet-token-scope.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.total_count == 1 and .repositories[0].full_name == $repo' "$RUNNER_TEMP/konaet-token-scope.json"
          jq -n --arg revision "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg login "$BOT_LOGIN" --argjson id "$BOT_ID" --arg installation "$INSTALLATION_ID" --arg repo "$GITHUB_REPOSITORY" \
            '{schema_version:1,status:"VERIFIED",authentication:"GitHub App installation token",source_revision:$revision,run_url:$run,bot_login:$login,bot_id:$id,installation_id:$installation,token_repositories:[$repo],fixture_used:false}' > artifacts/live-app.json
          printf 'App autenticada: %s (ID %s).\n' "$BOT_LOGIN" "$BOT_ID" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: konaet-live-app-proof
          path: artifacts/live-app.json
          if-no-files-found: warn
          retention-days: 30
