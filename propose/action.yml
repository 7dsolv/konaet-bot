name: Konaet Reviewable Update
description: Commits only allowed paths, pushes without force and creates or updates a pull request.
inputs:
  token:
    description: Token temporario retornado pela Action KONAET.
    required: true
  bot-login:
    description: Login Bot verificado pela Action de identidade.
    required: true
  bot-id:
    description: ID numerico verificado pela Action de identidade.
    required: true
  paths:
    description: Arquivos ou diretorios permitidos, um por linha, relativos a raiz e sem glob.
    required: true
  branch:
    description: Branch de proposta; nunca pode ser a branch padrao ou a base.
    default: konaet/updates
  base:
    description: Branch que recebera a proposta.
    default: main
  title:
    description: Titulo da proposta.
    default: 'Konaet: revisar atualizacoes'
  body:
    description: Descricao enviada ao revisor.
    default: Atualizacao gerada pelo workflow para revisao do mantenedor.
  commit-message:
    description: Mensagem do commit.
    default: 'Konaet: preparar alteracoes para revisao'
outputs:
  changed:
    description: true quando um novo commit foi criado; false em recuperacao ou sem mudancas.
    value: ${{ steps.propose.outputs.changed }}
  commit:
    description: SHA enviado ou recuperado da branch existente.
    value: ${{ steps.propose.outputs.commit }}
  pr-url:
    description: URL da proposta criada ou atualizada; vazia quando nao ha proposta.
    value: ${{ steps.propose.outputs.pr-url }}
  pr-number:
    description: Numero da proposta.
    value: ${{ steps.propose.outputs.pr-number }}
runs:
  using: composite
  steps:
    - name: Publicar somente o diff permitido para revisao
      id: propose
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_HOST: github.com
        BOT_LOGIN: ${{ inputs.bot-login }}
        BOT_ID: ${{ inputs.bot-id }}
        ALLOW_PATHS: ${{ inputs.paths }}
        PROPOSAL_BRANCH: ${{ inputs.branch }}
        BASE_BRANCH: ${{ inputs.base }}
        PR_TITLE: ${{ inputs.title }}
        PR_BODY: ${{ inputs.body }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$1" >&2; exit 1; }
        [ "$SERVER_URL" = 'https://github.com' ] || fail 'Este pacote suporta GitHub.com.'
        [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || fail 'Repositorio invalido.'
        [[ "$BOT_LOGIN" =~ ^[a-z0-9-]+\[bot\]$ ]] && [[ "$BOT_ID" =~ ^[1-9][0-9]*$ ]] || fail 'Identidade Bot invalida.'
        git check-ref-format --branch "$PROPOSAL_BRANCH" >/dev/null || fail 'Branch de proposta invalida.'
        git check-ref-format --branch "$BASE_BRANCH" >/dev/null || fail 'Branch base invalida.'
        [ "$PROPOSAL_BRANCH" != "$BASE_BRANCH" ] && [ "$PROPOSAL_BRANCH" != "$DEFAULT_BRANCH" ] || fail 'A proposta nao pode publicar na branch base/padrao.'
        [ -n "$PR_TITLE" ] && [ -n "$COMMIT_MESSAGE" ] || fail 'Titulo e mensagem sao obrigatorios.'
        cd "$(git rev-parse --show-toplevel)"
        expected="https://github.com/${GITHUB_REPOSITORY}"
        validate_origin() {
          local urls url count mode
          for mode in fetch push; do
            if [ "$mode" = push ]; then urls="$(git remote get-url --push --all origin)";
            else urls="$(git remote get-url --all origin)"; fi
            count=0
            while IFS= read -r url; do
              count=$((count+1))
              [ "$url" = "$expected" ] || [ "$url" = "${expected}.git" ] || fail 'Destino efetivo do Git difere do repositorio autorizado.'
            done <<< "$urls"
            [ "$count" -eq 1 ] || fail 'Origin deve ter exatamente um destino de leitura e escrita.'
          done
        }
        validate_origin
        git_network() {
          validate_origin
          git -c http.https://github.com/.extraheader= -c credential.helper= \
            -c 'credential.helper=!gh auth git-credential' "$@"
        }

        allowed=()
        while IFS= read -r entry || [ -n "$entry" ]; do
          entry="${entry%$'\r'}"
          [ -n "$entry" ] || continue
          entry="${entry%/}"
          if [[ -z "$entry" || "$entry" = /* || "$entry" = *\\* || "$entry" = :* || "$entry" = *//* || "$entry" =~ (^|/)\.\.?(/|$) || "$entry" = *[\*\?\[]* ]]; then
            fail 'Paths deve conter caminhos relativos literais, sem glob ou travessia.'
          fi
          allowed+=("$entry")
        done <<< "$ALLOW_PATHS"
        [ "${#allowed[@]}" -gt 0 ] || fail 'Informe pelo menos um caminho permitido.'

        validate_files() {
          for file in "$@"; do
            [[ "$file" != *$'\n'* && "$file" != *$'\r'* ]] || fail 'Nomes com quebra de linha nao sao suportados.'
            [[ "$file" != .github/workflows/* ]] || fail 'Este modulo nao altera workflows.'
            permitted=false
            for entry in "${allowed[@]}"; do
              if [[ "$file" = "$entry" || "$file" = "$entry/"* ]]; then permitted=true; break; fi
            done
            [ "$permitted" = true ] || fail 'O diff inclui arquivos fora de paths; nenhuma mudanca foi enviada.'
          done
        }
        temp_dir="$(mktemp -d)"
        trap 'rm -f "$temp_dir/diff" "$temp_dir/body"; rmdir "$temp_dir"' EXIT
        git diff --no-renames --name-only -z HEAD -- > "$temp_dir/diff"
        git ls-files --others --exclude-standard -z >> "$temp_dir/diff"
        mapfile -d '' changed < <(sort -zu "$temp_dir/diff")
        validate_files "${changed[@]}"
        validate_proposal() {
          merge_base="$(git merge-base "refs/remotes/origin/${BASE_BRANCH}" "$1")" || fail 'Historico insuficiente; use checkout com fetch-depth: 0.'
          git diff --no-renames --name-only -z "$merge_base" "$1" -- > "$temp_dir/diff"
          mapfile -d '' proposed < "$temp_dir/diff"
          validate_files "${proposed[@]}"
        }

        remote_sha="$(git_network ls-remote --heads origin "refs/heads/${PROPOSAL_BRANCH}" | cut -f1)"
        if [ "${#changed[@]}" -gt 0 ]; then
          git diff --no-renames --name-only -z -- > "$temp_dir/diff"
          git ls-files --others --exclude-standard -z >> "$temp_dir/diff"
          mapfile -d '' to_stage < <(sort -zu "$temp_dir/diff")
          if [ "${#to_stage[@]}" -gt 0 ]; then
            git --literal-pathspecs add -A -- "${to_stage[@]}"
          fi
          if git diff --cached --quiet --; then changed=(); fi
        fi
        created=false
        commit_sha=''
        if [ "${#changed[@]}" -eq 0 ]; then
          if [ -z "$remote_sha" ]; then
            printf 'changed=false\ncommit=\npr-url=\npr-number=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git_network fetch --no-tags origin "refs/heads/${PROPOSAL_BRANCH}:refs/remotes/origin/${PROPOSAL_BRANCH}" "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          remote_sha="$(git rev-parse "refs/remotes/origin/${PROPOSAL_BRANCH}")"
          validate_proposal "$remote_sha"
          if [ "${#proposed[@]}" -eq 0 ]; then
            printf 'changed=false\ncommit=\npr-url=\npr-number=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit_sha="$remote_sha"
        else
          if [ -n "$remote_sha" ]; then
            git_network fetch --no-tags origin "refs/heads/${PROPOSAL_BRANCH}:refs/remotes/origin/${PROPOSAL_BRANCH}"
            remote_sha="$(git rev-parse "refs/remotes/origin/${PROPOSAL_BRANCH}")"
            git merge-base --is-ancestor "$remote_sha" HEAD || fail 'A branch remota avancou; atualize o checkout antes de gerar o diff.'
          fi
          git_network fetch --no-tags origin "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          email="${BOT_ID}+${BOT_LOGIN}@users.noreply.github.com"
          GIT_AUTHOR_NAME="$BOT_LOGIN" GIT_AUTHOR_EMAIL="$email" \
            GIT_COMMITTER_NAME="$BOT_LOGIN" GIT_COMMITTER_EMAIL="$email" \
            git commit -m "$COMMIT_MESSAGE"
          commit_sha="$(git rev-parse HEAD)"
          validate_proposal "$commit_sha"
          git_network push origin "HEAD:refs/heads/${PROPOSAL_BRANCH}"
          created=true
        fi
        printf 'changed=%s\ncommit=%s\n' "$created" "$commit_sha" >> "$GITHUB_OUTPUT"

        body_file="$temp_dir/body"
        printf '%s\n' "$PR_BODY" > "$body_file"
        pr_fields='number,url,headRefName,baseRefName,headRefOid,headRepositoryOwner,headRepository,isCrossRepository'
        pr_query='.[] | [.number,.url,.headRepositoryOwner.login,.headRepository.name,.headRefName,.baseRefName,.headRefOid,.isCrossRepository] | @tsv'
        validate_pr() {
          local record="$1" owner repo head base sha cross
          IFS=$'\t' read -r number url owner repo head base sha cross <<< "$record"
          [[ "$number" =~ ^[1-9][0-9]*$ ]] && [ "$url" = "https://github.com/${GITHUB_REPOSITORY}/pull/${number}" ] || fail 'A API retornou uma proposta inesperada.'
          [ "$owner/$repo" = "$GITHUB_REPOSITORY" ] && [ "$cross" = false ] || fail 'A proposta pertence a outro repositorio.'
          [ "$head" = "$PROPOSAL_BRANCH" ] && [ "$base" = "$BASE_BRANCH" ] || fail 'Branches da proposta nao correspondem ao envio.'
          if [ "${2:-strict}" = strict ]; then
            [ "$sha" = "$commit_sha" ] || fail 'A PR nao contem o commit enviado; nao sera editada.'
          fi
        }
        find_pr() {
          local records record n u owner repo head base sha cross selected='' selected_sha=''
          records="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PROPOSAL_BRANCH" \
            --base "$BASE_BRANCH" --state open --limit 100 --json "$pr_fields" --jq "$pr_query")" || return $?
          while IFS= read -r record; do
            [ -n "$record" ] || continue
            IFS=$'\t' read -r n u owner repo head base sha cross <<< "$record"
            [[ "$n" =~ ^[1-9][0-9]*$ && "$sha" =~ ^[0-9a-f]{40}$ ]] && \
              [ -n "$u" ] && [ -n "$owner" ] && [ -n "$repo" ] && [ -n "$head" ] && [ -n "$base" ] && \
              { [ "$cross" = true ] || [ "$cross" = false ]; } || fail 'Metadados incompletos de PR retornados pela API.'
            # Forks can share the branch name. They must never be edited.
            if [ "$cross" = true ] || [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then continue; fi
            validate_pr "$record" identity
            [ -z "$selected" ] || fail 'Mais de uma PR corresponde a branch; resolva a ambiguidade.'
            selected="$record"
            selected_sha="$sha"
          done <<< "$records"
          printf '%s' "$selected"
          if [ -n "$selected" ] && [ "$selected_sha" != "$commit_sha" ]; then return 75; fi
        }
        find_current_pr() {
          local candidate status attempt
          for attempt in 0 1 2 3 4; do
            if candidate="$(find_pr)"; then printf '%s' "$candidate"; return 0;
            else status=$?; [ "$status" -eq 75 ] || return "$status"; fi
            [ "$attempt" -lt 4 ] || fail 'A API ainda nao confirma o SHA enviado; nenhuma PR sera editada. Uma nova execucao pode recuperar o push.'
            sleep "$((attempt+1))"
          done
        }
        record="$(find_current_pr)"
        if [ -z "$record" ]; then
          if url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" \
            --head "$PROPOSAL_BRANCH" --title "$PR_TITLE" --body-file "$body_file")"; then
            number="${url##*/}"
          else
            record="$(find_current_pr)"
            [ -n "$record" ] || fail 'O push terminou, mas a API nao criou a proposta. Uma nova execucao pode recupera-la.'
          fi
        fi
        if [ -n "$record" ]; then validate_pr "$record"; fi
        [[ "$number" =~ ^[1-9][0-9]*$ ]] && [ "$url" = "https://github.com/${GITHUB_REPOSITORY}/pull/${number}" ] || fail 'A API retornou uma proposta inesperada.'
        # Re-read after push/create: the returned URL alone proves no head identity.
        for attempt in 0 1 2 3 4; do
          current="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json "$pr_fields" \
            --jq '[.number,.url,.headRepositoryOwner.login,.headRepository.name,.headRefName,.baseRefName,.headRefOid,.isCrossRepository] | @tsv')"
          validate_pr "$current" identity
          current_sha="$(cut -f7 <<< "$current")"
          [ "$current_sha" != "$commit_sha" ] || break
          [ "$attempt" -lt 4 ] || fail 'A releitura da API ainda nao confirma o SHA enviado; nenhuma PR sera editada.'
          sleep "$((attempt+1))"
        done
        validate_pr "$current"
        if [ -n "$record" ]; then
          gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body-file "$body_file"
        fi
        printf 'pr-url=%s\npr-number=%s\n' "$url" "$number" >> "$GITHUB_OUTPUT"
