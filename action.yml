name: KONAET
description: Verified GitHub App identity and scoped tokens for reviewable repository updates.
author: Adilson Oliveira / Konaet
branding:
  icon: git-pull-request
  color: purple
inputs:
  client-id:
    description: Client ID da GitHub App do mantenedor.
    required: true
  private-key:
    description: Chave privada da App, recebida de um Actions Secret.
    required: true
  expected-slug:
    description: Slug esperado da App; evita publicar com outra identidade.
    default: konaet
outputs:
  token:
    description: Token temporario limitado ao repositorio atual, revogado ao encerrar o job.
    value: ${{ steps.app.outputs.token }}
  installation-id:
    description: ID da instalacao autorizada.
    value: ${{ steps.app.outputs.installation-id }}
  app-slug:
    description: Slug real retornado pelo GitHub.
    value: ${{ steps.app.outputs.app-slug }}
  bot-login:
    description: Login real do bot.
    value: ${{ steps.identity.outputs.login }}
  bot-id:
    description: ID do usuario bot retornado pela API.
    value: ${{ steps.identity.outputs.id }}
  bot-email:
    description: Email noreply correspondente ao usuario bot.
    value: ${{ steps.identity.outputs.email }}
runs:
  using: composite
  steps:
    - name: Criar token restrito ao repositorio atual
      id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - name: Conferir a identidade registrada no GitHub
      id: identity
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        GH_HOST: github.com
        APP_SLUG: ${{ steps.app.outputs.app-slug }}
        EXPECTED_SLUG: ${{ inputs.expected-slug }}
      run: |
        set -euo pipefail
        if [ -z "$EXPECTED_SLUG" ] || [ "$APP_SLUG" != "$EXPECTED_SLUG" ]; then
          echo '::error::A App autenticada nao corresponde ao slug configurado.'
          exit 1
        fi
        login="${APP_SLUG}[bot]"
        identity="$(gh api --hostname github.com "/users/${login}" --jq '[.id,.login,.type] | @tsv')"
        IFS=$'\t' read -r bot_id actual_login account_type <<< "$identity"
        if ! [[ "$bot_id" =~ ^[1-9][0-9]*$ ]] || [ "$actual_login" != "$login" ] || [ "$account_type" != 'Bot' ]; then
          echo '::error::O GitHub nao confirmou ID, login e tipo Bot esperados.'
          exit 1
        fi
        {
          echo "login=${login}"
          echo "id=${bot_id}"
          echo "email=${bot_id}+${login}@users.noreply.github.com"
        } >> "$GITHUB_OUTPUT"
